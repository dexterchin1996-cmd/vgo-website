<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="V'GO">
  <defs>
    <linearGradient id="vgoGrad" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A5A"/>
      <stop offset="0.42" stop-color="#FF6600"/>
      <stop offset="1" stop-color="#D94800"/>
    </linearGradient>
    <linearGradient id="vgoSheen" x1="256" y1="24" x2="256" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vgoGlow" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="vgoSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#B33C00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 圆润方底（squircle 观感）＋玻璃高光 -->
  <g filter="url(#vgoSoft)">
    <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#vgoGrad)"/>
    <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#vgoGlow)"/>
    <rect x="34" y="34" width="444" height="444" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="3"/>
    <path d="M152 40h208c50 0 90 40 90 90v86c-58 38-166 62-244 62-56 0-110-8-150-22V130c0-50 40-90 90-90z" fill="url(#vgoSheen)" opacity="0.55"/>
  </g>

  <!-- V 字：一次落笔的圆头笔画 -->
  <path d="M150 176 L256 348 L362 176" fill="none" stroke="#FFFFFF" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- GO 点：带一点点“出发”的方向感 -->
  <circle cx="372" cy="158" r="21" fill="#FFFFFF" fill-opacity="0.92"/>
</svg>
